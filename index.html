// ---- ビュー切替 ----
function switchView(view) {
  document.getElementById('view-kamoku').classList.toggle('d-none', view !== 'kamoku');
  document.getElementById('view-gakko').classList.toggle('d-none', view !== 'gakko');
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + view).classList.add('active');
  if (view === 'gakko') initSchoolDashboard();
}

// ---- 共通フォーマッター ----
function fmtYen(v) {
  const abs = Math.abs(Math.round(v)).toLocaleString('ja-JP');
  return (v < 0 ? '-' : '') + '¥' + abs;
}
function fmtDiff(v) {
  if (v === 0) return '<span>¥0</span>';
  const sign = v > 0 ? '+' : '';
  const cls  = v > 0 ? 'pos' : 'neg';
  return `<span class="${cls}">${sign}${fmtYen(v)}</span>`;
}
function fmtVal(v, level) {
  if (level === 'ratio') return (v >= 0 ? '' : '-') + Math.abs(v).toFixed(1) + '%';
  return fmtYen(v);
}

// ---- 科目別 ----
function buildKpi(rows) {
  const keys = ['売上高','仕入高','売上利益','販売費及び一般管理費計','営業利益'];
  return keys.map(k => {
    const r = rows.find(x => x.acct === k);
    if (!r) return '';
    const rateSign = r.diff_rate >= 0 ? '+' : '';
    const cls = r.diff_rate >= 0 ? 'pos' : 'neg';
    return `<div class="kpi-card">
      <div class="label">${k}</div>
      <div class="value">${fmtYen(r.actual)}</div>
      <div class="rate ${cls}">${rateSign}${r.diff_rate.toFixed(1)}% vs予算</div>
    </div>`;
  }).join('');
}

function buildSummary(dept, month, mode) {
  const src = (mode === 'cumulative') ? CUMULATIVE_ANALYSIS_DATA : ANALYSIS_DATA;
  const text = (src[dept] || {})[month] || '分析データがありません。';
  const lines = text.split('\n').filter(l => l.trim());
  const linesHtml = lines.map(l => `<div class="smry-line">${l}</div>`).join('');
  return `<div class="diff-summary-panel">
    <div class="smry-head">
      <span class="smry-badge">分析</span>
      <span class="smry-head-title">差異要因（上位）</span>
    </div>
    ${linesHtml}
  </div>`;
}

function buildTable(rows) {
  const tbody = rows.map(r => {
    const sign = r.diff >= 0 ? '+' : '';
    const rateSign = r.diff_rate >= 0 ? '+' : '';
    const cls = r.diff !== 0 ? (r.diff > 0 ? 'pos' : 'neg') : '';
    const acctIndent = r.level === 'small' ? ' class="acct-indent"' : '';
    return `<tr class="lv-${r.level} row-${r.status}">
      <td${acctIndent}>${r.display_name}</td>
      <td class="text-end">${fmtVal(r.budget, r.level)}</td>
      <td class="text-end">${fmtVal(r.actual, r.level)}</td>
      <td class="text-end ${cls}">${sign}${fmtVal(r.diff, r.level)}</td>
      <td class="text-end ${cls}">${rateSign}${r.diff_rate.toFixed(1)}%</td>
      <td class="text-center"><span class="badge badge-${r.status}">${r.status}</span></td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap">
    <table class="table table-sm table-bordered mb-0">
      <thead><tr>
        <th>科目</th>
        <th class="text-end" style="min-width:110px">予算(円)</th>
        <th class="text-end" style="min-width:110px">実績(円)</th>
        <th class="text-end" style="min-width:110px">差異(円)</th>
        <th class="text-end" style="width:75px">差異率</th>
        <th style="width:72px">判定</th>
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

function renderChart(canvasId, rows) {
  const sorted = rows
    .filter(r => r.level !== 'large' && r.level !== 'ratio')
    .sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff))
    .slice(0, 10);
  if (!sorted.length) return;
  if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  charts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(r => r.display_name),
      datasets: [{
        label: '差異(実績-予算)',
        data: sorted.map(r => r.diff),
        backgroundColor: sorted.map(r => r.diff > 0 ? '#ef4444' : '#22c55e'),
        borderWidth: 0,
      }]
    },
    options: {
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => (c.raw >= 0 ? '+' : '') + fmtYen(c.raw) } }
      },
      scales: {
        x: { ticks: { callback: v => (v >= 0 ? '+' : '') + (v / 10000).toFixed(0) + '万' } }
      }
    }
  });
}

function renderChartForMode(dept, month, mode) {
  const rows = mode === 'cumulative'
    ? (CUMULATIVE_DATA[dept]?.[month] || [])
    : (DATA[dept]?.[month] || []);
  const cid = (mode === 'cumulative' ? 'chartcum-' : 'chart-')
    + `${dept}-${month}`.replace(/[（）\s]/g, '_');
  requestAnimationFrame(() => renderChart(cid, rows));
}

function setSubMode(dept, mode) {
  subMode[dept] = mode;
  document.querySelectorAll(`[data-dept-sub="${dept}"]`).forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  document.querySelectorAll(`[data-dept-monthly="${dept}"]`).forEach(el => {
    el.classList.toggle('d-none', mode !== 'monthly');
  });
  document.querySelectorAll(`[data-dept-cumulative="${dept}"]`).forEach(el => {
    el.classList.toggle('d-none', mode !== 'cumulative');
  });
  const activePill = document.querySelector(`.month-pill.active[data-dept="${dept}"]`);
  if (activePill) renderChartForMode(dept, activePill.dataset.month, mode);
}

function showContent(dept, month) {
  document.querySelectorAll(`[data-dept="${dept}"][data-month]`).forEach(el => {
    const isActive = el.dataset.month === month;
    el.classList.toggle('active', isActive);
    const pane = document.getElementById(el.dataset.pane);
    if (pane) pane.classList.toggle('d-none', !isActive);
  });
  const mode = subMode[dept] || 'monthly';
  renderChartForMode(dept, month, mode);
}

        </div>
        <div data-dept-cumulative="${dept}" class="d-none">
          <div class="mb-2"><span class="cum-period-badge">累積: ${cumLabel}</span></div>
          <div class="summary-bar">${buildKpi(cumRows)}</div>
          ${buildTable(cumRows)}
          <div class="mt-3">
            <div class="text-muted small fw-semibold mb-1">差異上位10科目（販管費）</div>
            <div class="diff-section-wrap">
              <div class="diff-chart-col"><div class="chart-wrap"><canvas id="${cidCum}"></canvas></div></div>
              ${buildSummary(dept, m, 'cumulative')}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');

    const pane = document.createElement('div');
    pane.className = `tab-pane fade${isFirst ? ' show active' : ''}`;
    pane.id = deptPaneId;
    pane.innerHTML = `<div class="d-flex align-items-center flex-wrap gap-2 mb-3 pt-1">
      ${subToggle}<div>${monthPills}</div></div>${monthPanes}`;
    deptContentEl.appendChild(pane);
  });

  const d0 = DEPTS[0];
  const m0 = MONTHS.find(m => DATA[d0]?.[m]);
  if (d0 && m0) {
    const cid = `chart-${d0}-${m0}`.replace(/[（）\s]/g, '_');
    requestAnimationFrame(() => renderChart(cid, DATA[d0][m0]));
  }

  deptTabsEl.addEventListener('shown.bs.tab', e => {
    const target = e.target.dataset.bsTarget;
    const pane = document.querySelector(target);
    if (!pane) return;
    const activeMonthBtn = pane.querySelector('.month-pill.active');
    if (!activeMonthBtn) return;
    const dept  = activeMonthBtn.dataset.dept;
    const month = activeMonthBtn.dataset.month;
    const mode  = subMode[dept] || 'monthly';
    renderChartForMode(dept, month, mode);
  });
}

// ---- 学校別: スプレッドシート風 6行構造テーブル ----
function buildSchoolTable(schools) {
  if (!schools || schools.length === 0) {
    return '<p class="text-muted py-3 text-center">データがありません</p>';
  }

  function valCell(obj, key, extraCls) {
    const v = (obj || {})[key] || 0;
    return `<td class="text-end${extraCls ? ' ' + extraCls : ''}">${fmtYen(v)}</td>`;
  }
  function diffCell(obj, key) {
    const v = (obj || {})[key] || 0;
    const cls = v > 0 ? 'pos' : v < 0 ? 'neg' : '';
    const sign = v > 0 ? '+' : '';
    return `<td class="text-end ${cls}">${sign}${fmtYen(v)}</td>`;
  }

  const headerCols = SCH_MONTHS.map(m => `<th class="text-end">${m}</th>`).join('');
  const thead = `<tr>
    <th class="s-tflag">T</th>
    <th>学校名</th>
    <th>請求方式</th>
    <th></th>
    ${headerCols}
    <th class="text-end s-total">合計</th>
    <th class="text-end s-prior">前月予実</th>
    <th class="s-alert-cell">アラート</th>
  </tr>`;

  const tbody = schools.map(s => {
    const flagKey = s.t_flag ? s.t_flag.toLowerCase() : 'none';
    const flagCls = `s-flag-${flagKey}`;
    const alertCls = s.alert === '上振れ' ? 'alert-up' : s.alert === '下振れ' ? 'alert-down' : '';

    // 実績行
    const r1 = `<tr class="s-row-actual ${flagCls}">
      <td class="s-tflag" rowspan="3">${s.t_flag || ''}</td>
      <td class="s-name ${flagCls}" rowspan="3">${s.name}</td>
      <td class="s-billing" rowspan="3">${s.billing_method || ''}</td>
      <td class="s-label">実績</td>
      ${SCH_MONTHS.map(m => valCell(s.actual, m)).join('')}
      ${valCell(s.actual, 'total', 's-total')}
      <td class="text-end s-prior">${fmtYen(s.jisseki_prior || 0)}</td>
      <td class="s-alert-cell ${alertCls}" rowspan="3">${s.alert || ''}</td>
    </tr>`;

    // 予算行
    const r2 = `<tr class="s-row-budget ${flagCls}">
      <td class="s-label">予算</td>
      ${SCH_MONTHS.map(m => valCell(s.budget, m)).join('')}
      ${valCell(s.budget, 'total', 's-total')}
      <td></td>
    </tr>`;

    // 予実差行
    const r3 = `<tr class="s-row-diff ${flagCls}">
      <td class="s-label">予実差</td>
      ${SCH_MONTHS.map(m => diffCell(s.diff, m)).join('')}
      ${diffCell(s.diff, 'total')}
      <td></td>
    </tr>`;

    return r1 + r2 + r3;
  }).join('');

  return `<div class="s-table-wrap">
    <table class="s-table">
      <thead>${thead}</thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

// ---- 学校別: 粗利管理テーブル ----
function buildGrossProfitTable(schools) {
  if (!schools || schools.length === 0) {
    return '<p class="text-muted py-3 text-center">データがありません</p>';
  }
  function fmtRate(v) {
    if (!v || isNaN(v)) return '—';
    return v.toFixed(1) + '%';
  }
  function rateCls(actual, budget) {
    if (!actual && !budget) return '';
    return actual >= budget ? 'pos' : 'neg';
  }

  const cumIdx = SCH_MONTHS.indexOf(PREV_MONTH);
  const cumMonths = cumIdx >= 0 ? SCH_MONTHS.slice(0, cumIdx + 1) : [];
  const cumHeader = cumMonths.length ? `4月〜${PREV_MONTH}平均` : '—';

  const headerCols = SCH_MONTHS.map(m => `<th class="text-end">${m}</th>`).join('');
  const thead = `<tr>
    <th>学校名</th>
    <th></th>
    ${headerCols}
    <th class="text-end s-total">合計</th>
    <th class="text-end s-total">${cumHeader}</th>
    <th class="s-alert-cell">アラート</th>
  </tr>`;

  const tbody = schools.map(s => {
    const cumActualVals = cumMonths.map(m => s.actual_rate[m] || 0).filter(v => v !== 0);
    const cumAvgActual  = cumActualVals.length ? cumActualVals.reduce((t, v) => t + v, 0) / cumActualVals.length : 0;
    const cumBudgetVals = cumMonths.map(m => s.budget_rate[m] || 0).filter(v => v !== 0);
    const cumAvgBudget  = cumBudgetVals.length ? cumBudgetVals.reduce((t, v) => t + v, 0) / cumBudgetVals.length : 0;

    const alertCls = s.alert === '上振れ' ? 'alert-up' : s.alert === '下振れ' ? 'alert-down' : '';
    const r1 = `<tr class="s-row-actual-rate">
      <td class="s-name" rowspan="2">${s.name}</td>
      <td class="s-label">実績</td>
      ${SCH_MONTHS.map(m => {
        const cls = rateCls(s.actual_rate[m], s.budget_rate[m]);
        return `<td class="rate-cell ${cls}">${fmtRate(s.actual_rate[m])}</td>`;
      }).join('')}
      <td class="rate-cell s-total ${rateCls(s.actual_total, s.budget_total)}">${fmtRate(s.actual_total)}</td>
      <td class="rate-cell s-total ${rateCls(cumAvgActual, cumAvgBudget)}">${fmtRate(cumAvgActual)}</td>
      <td class="s-alert-cell ${alertCls}" rowspan="2">${s.alert || ''}</td>
    </tr>`;
    const r2 = `<tr class="s-row-budget-rate">
      <td class="s-label">見積</td>
      ${SCH_MONTHS.map(m => `<td class="rate-cell">${fmtRate(s.budget_rate[m])}</td>`).join('')}
      <td class="rate-cell s-total">${fmtRate(s.budget_total)}</td>
      <td class="rate-cell s-total">${fmtRate(cumAvgBudget)}</td>
    </tr>`;
    return r1 + r2;
  }).join('');

  return `<div class="s-table-wrap">
    <table class="s-table">
      <thead>${thead}</thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

// ---- 学校別: 指導時間外テーブル ----
function buildOvertimeTable(schools) {
  if (!schools || schools.length === 0) {
    return '<p class="text-muted py-3 text-center">データがありません</p>';
  }
  function diffFmtYen(diff) {
    if (diff === 0) return '<span>—</span>';
    const sign = diff > 0 ? '+' : '';
    const cls  = diff > 0 ? 'neg' : 'pos';
    return `<span class="${cls}">${sign}${fmtYen(diff)}</span>`;
  }

  const cumIdx = SCH_MONTHS.indexOf(PREV_MONTH);
  const cumMonths = cumIdx >= 0 ? SCH_MONTHS.slice(0, cumIdx + 1) : [];
  const cumHeader = cumMonths.length ? `4月〜${PREV_MONTH}累計` : '—';

  const headerCols = SCH_MONTHS.map(m => `<th class="text-end">${m}</th>`).join('');
  const thead = `<tr>
    <th>学校名</th>
    <th></th>
    ${headerCols}
    <th class="text-end s-total">年予算/合計</th>
    <th class="text-end s-total">${cumHeader}</th>
  </tr>`;

  const tbody = schools.map(s => {
    const cumActual = cumMonths.reduce((t, m) => t + (s.actual[m] || 0), 0);
    const cumBudget = cumMonths.reduce((t, m) => t + (s.budget[m] || 0), 0);
    const cumDiff   = cumActual - cumBudget;
    const r1 = `<tr class="s-row-actual">
      <td class="s-name" rowspan="3">${s.name}</td>
      <td class="s-label">実績</td>
      ${SCH_MONTHS.map(m => `<td class="text-end">${s.actual[m] ? fmtYen(s.actual[m]) : '—'}</td>`).join('')}
      <td class="text-end s-total">${fmtYen(s.actual_total)}</td>
      <td class="text-end s-total">${fmtYen(cumActual)}</td>
    </tr>`;
    const r2 = `<tr class="s-row-budget">
      <td class="s-label">計画</td>
      ${SCH_MONTHS.map(m => `<td class="text-end">${s.budget[m] ? fmtYen(s.budget[m]) : '—'}</td>`).join('')}
      <td class="text-end s-total">${fmtYen(s.budget_total)}</td>
      <td class="text-end s-total">${fmtYen(cumBudget)}</td>
    </tr>`;
    const r3 = `<tr class="s-row-diff">
      <td class="s-label">差異</td>
      ${SCH_MONTHS.map(m => {
        const diff = (s.actual[m] || 0) - (s.budget[m] || 0);
        return `<td class="text-end">${diffFmtYen(diff)}</td>`;
      }).join('')}
      <td class="text-end s-total">${diffFmtYen(s.actual_total - s.budget_total)}</td>
      <td class="text-end s-total">${diffFmtYen(cumDiff)}</td>
    </tr>`;
    return r1 + r2 + r3;
  }).join('');

  return `<div class="s-table-wrap">
    <table class="s-table">
      <thead>${thead}</thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

// ---- 学校別: 派遣時間テーブル ----
function buildDispatchTable(schools) {
  if (!schools || schools.length === 0) {
    return '<p class="text-muted py-3 text-center">データがありません</p>';
  }
  function fmtH(v) {
    if (!v && v !== 0) return '—';
    return v === 0 ? '—' : v.toFixed(1) + 'h';
  }
  function diffFmt(diff) {
    if (diff === 0) return '<span>—</span>';
    const sign = diff > 0 ? '+' : '';
    const cls  = diff > 0 ? 'neg' : 'pos';
    return `<span class="${cls}">${sign}${diff.toFixed(1)}h</span>`;
  }

  const cumIdx = SCH_MONTHS.indexOf(PREV_MONTH);
  const cumMonths = cumIdx >= 0 ? SCH_MONTHS.slice(0, cumIdx + 1) : [];
  const cumHeader = cumMonths.length ? `4月〜${PREV_MONTH}累計` : '—';

  const headerCols = SCH_MONTHS.map(m => `<th class="text-end">${m}</th>`).join('');
  const thead = `<tr>
    <th>学校名</th>
    <th></th>
    ${headerCols}
    <th class="text-end s-total">合計</th>
    <th class="text-end s-total">${cumHeader}</th>
  </tr>`;

  const tbody = schools.map(s => {
    const cumActual = cumMonths.reduce((t, m) => t + (s.actual[m] || 0), 0);
    const cumBudget = cumMonths.reduce((t, m) => t + (s.budget[m] || 0), 0);
    const cumDiff   = cumActual - cumBudget;
    const r1 = `<tr class="s-row-actual">
      <td class="s-name" rowspan="3">${s.name}</td>
      <td class="s-label">実績</td>
      ${SCH_MONTHS.map(m => `<td class="rate-cell">${fmtH(s.actual[m] || 0)}</td>`).join('')}
      <td class="rate-cell s-total">${fmtH(s.actual_total)}</td>
      <td class="rate-cell s-total">${fmtH(cumActual)}</td>
    </tr>`;
    const r2 = `<tr class="s-row-budget">
      <td class="s-label">予算</td>
      ${SCH_MONTHS.map(m => `<td class="rate-cell">${fmtH(s.budget[m] || 0)}</td>`).join('')}
      <td class="rate-cell s-total">${fmtH(s.budget_total)}</td>
      <td class="rate-cell s-total">${fmtH(cumBudget)}</td>
    </tr>`;
    const r3 = `<tr class="s-row-diff">
      <td class="s-label">差異</td>
      ${SCH_MONTHS.map(m => {
        const diff = (s.actual[m] || 0) - (s.budget[m] || 0);
        return `<td class="rate-cell">${diffFmt(diff)}</td>`;
      }).join('')}
      <td class="rate-cell s-total">${diffFmt(s.actual_total - s.budget_total)}</td>
      <td class="rate-cell s-total">${diffFmt(cumDiff)}</td>
    </tr>`;
    return r1 + r2 + r3;
  }).join('');

  return `<div class="s-table-wrap">
    <table class="s-table">
      <thead>${thead}</thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

let schoolInitialized = false;
function initSchoolDashboard() {
  if (schoolInitialized) return;
  schoolInitialized = true;

  // 4つのサブタブを追加
  const schoolSubTabsEl = document.getElementById('schoolSubTabs');
  [
    { id: 'stab-sales',    label: '売上予実' },
    { id: 'stab-gross',    label: '粗利管理' },
    { id: 'stab-dispatch', label: '派遣時間' },
    { id: 'stab-overtime', label: '指導時間外' },
  ].forEach((st, si) => {
    const btn = document.createElement('li');
    btn.className = 'nav-item';
    btn.innerHTML = `<button class="nav-link school-sub-tab${si === 0 ? ' active' : ''}"
      data-bs-toggle="tab" data-bs-target="#${st.id}" type="button">${st.label}</button>`;
    schoolSubTabsEl.appendChild(btn);
  });

  // 売上予実: 既存の関東/関西テーブル
  const salesRegionTabsEl    = document.getElementById('salesRegionTabs');
  const salesRegionContentEl = document.getElementById('salesRegionContent');
  SCHOOL_REGIONS.forEach((region, ri) => {
    const isFirst = ri === 0;
    const paneId  = `sales-rpane-${ri}`;
    const btn = document.createElement('li');
    btn.className = 'nav-item';
    btn.innerHTML = `<button class="nav-link dept-tab${isFirst ? ' active' : ''}"
      data-bs-toggle="tab" data-bs-target="#${paneId}" type="button">${region}</button>`;
    salesRegionTabsEl.appendChild(btn);
    const pane = document.createElement('div');
    pane.className = `tab-pane fade${isFirst ? ' show active' : ''}`;
    pane.id = paneId;
    pane.innerHTML = buildSchoolTable(SCHOOL_DATA[region] || []);
    salesRegionContentEl.appendChild(pane);
  });

  // 粗利管理: 関東/関西
  const grossRegionTabsEl    = document.getElementById('grossRegionTabs');
  const grossRegionContentEl = document.getElementById('grossRegionContent');
  SCHOOL_REGIONS.forEach((region, ri) => {
    const isFirst = ri === 0;
    const paneId  = `gross-rpane-${ri}`;
    const btn = document.createElement('li');
    btn.className = 'nav-item';
    btn.innerHTML = `<button class="nav-link dept-tab${isFirst ? ' active' : ''}"
      data-bs-toggle="tab" data-bs-target="#${paneId}" type="button">${region}</button>`;
    grossRegionTabsEl.appendChild(btn);
    const pane = document.createElement('div');
    pane.className = `tab-pane fade${isFirst ? ' show active' : ''}`;
    pane.id = paneId;
    pane.innerHTML = buildGrossProfitTable(GROSS_PROFIT_DATA[region] || []);
    grossRegionContentEl.appendChild(pane);
  });

  // 派遣時間
  document.getElementById('stab-dispatch').innerHTML = buildDispatchTable(DISPATCH_DATA);

  // 指導時間外: 関東/関西
  const overtimeRegionTabsEl    = document.getElementById('overtimeRegionTabs');
  const overtimeRegionContentEl = document.getElementById('overtimeRegionContent');
  Object.keys(OVERTIME_DATA).forEach((region, ri) => {
    const isFirst = ri === 0;
    const paneId  = `overtime-rpane-${ri}`;
    const btn = document.createElement('li');
    btn.className = 'nav-item';
    btn.innerHTML = `<button class="nav-link dept-tab${isFirst ? ' active' : ''}"
      data-bs-toggle="tab" data-bs-target="#${paneId}" type="button">${region}</button>`;
    overtimeRegionTabsEl.appendChild(btn);
    const pane = document.createElement('div');
    pane.className = `tab-pane fade${isFirst ? ' show active' : ''}`;
    pane.id = paneId;
    pane.innerHTML = buildOvertimeTable(OVERTIME_DATA[region] || []);
    overtimeRegionContentEl.appendChild(pane);
  });
}

document.addEventListener('DOMContentLoaded', initDashboard);
</script>
